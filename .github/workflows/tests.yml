name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: pip install pytest numpy scipy
      - name: Run pure-logic unit tests (no torch/GPU required)
        run: python -m pytest tests/test_faithfulness_and_trust.py -v
